name: Build and Push NotificationHub Docker Images

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'

jobs:
  build-and-push-api:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: ghcr.io/muhammedadebiyi/notificationhub-api:staging
      - name: Deploy API to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: 167.233.64.249
          username: root
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: /opt/notificationhub/deploy-api.sh

  build-and-push-worker:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker
          push: true
          tags: ghcr.io/muhammedadebiyi/notificationhub-worker:staging
      - name: Deploy Worker to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: 167.233.64.249
          username: root
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: /opt/notificationhub/deploy-worker.sh