[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "notificationhub"
version = "1.0.0"
description = "Official Python SDK for NotificationHub — multi-provider email notification platform"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "NotificationHub"},
]
keywords = ["notification", "email", "transactional", "campaign", "api", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://notificationhub.space"
Repository = "https://github.com/MuhammedAdebiyi/NotificationHub"

[project.optional-dependencies]
dev = ["pytest>=7.0"]
